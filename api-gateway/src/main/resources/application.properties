spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
spring.cloud.loadbalancer.cache.ttl=5s

spring.cloud.gateway.server.webflux.routes[0].id=usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[1].id=roles
spring.cloud.gateway.server.webflux.routes[1].uri=lb://roles-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/roles/**

spring.cloud.gateway.server.webflux.routes[2].id=compromisos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://compromisos-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/compromisos/**,/api/comprobantes/**,/api/reportes/**
